  <!-- Gauge track: a lap that opens at the bottom -->
  <path d="M9.64 22.86A9 9 0 1 1 22.36 22.86" fill="none" stroke="#FFFFFF" stroke-opacity=".32" stroke-width="3" stroke-linecap="round"/>
  <!-- Score arc, almost full -->
